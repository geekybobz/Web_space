<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Mohammed Bilal P S, PhD candidate in Quantum Control, Theoretical Physics, and AI.">
    <title>Mohammed Bilal P S | Quantum Control &amp; Physics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v={{ASSET_VERSION}}">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="navbar">
        <div class="nav-content">
            <a href="#" class="brand" data-page-link="0">MBPS.</a>
            <div class="nav-links">
                <a href="#about" class="nav-link" data-page-link="1"><i class="fa-solid fa-terminal" style="margin-right:4px;"></i> About</a>
                <a href="#philosophy" class="nav-link" data-page-link="2"><i class="fa-solid fa-lightbulb" style="margin-right:4px;"></i> Philosophy</a>
                <a href="#experience" class="nav-link" data-page-link="3"><i class="fa-solid fa-code-branch" style="margin-right:4px;"></i> Experience</a>
                <a href="#education" class="nav-link" data-page-link="4"><i class="fa-solid fa-graduation-cap" style="margin-right:4px;"></i> Education</a>
                <a href="under_construction.html" class="nav-link"><i class="fa-solid fa-microchip" style="margin-right:4px;"></i> Research</a>
                <a href="#contact" class="nav-link btn-contact" data-page-link="7"><i class="fa-solid fa-paper-plane" style="margin-right:4px;"></i> Contact</a>
            </div>
            <div class="nav-right">
                <div class="mode-toggle" aria-label="Theme mode toggle" role="group">
                    <button class="mode-toggle-btn" data-theme-mode="dark" aria-label="Select |0> state">
                        <span class="mode-state">|0&gt;</span>
                    </button>
                    <button class="mode-toggle-btn" data-theme-mode="mid" aria-label="Select superposition mode 1 over root 2 of |0> plus |1>">
                        <span class="mode-state">|0&gt;+|1&gt;</span>
                    </button>
                    <button class="mode-toggle-btn" data-theme-mode="light" aria-label="Select |1> state">
                        <span class="mode-state">|1&gt;</span>
                    </button>
                </div>
                <a href="https://scholar.google.com/citations?user=Yo9U7rIAAAAJ&hl=en" target="_blank" rel="noopener noreferrer" class="nav-scholar">
                    <i class="fa-solid fa-graduation-cap"></i> Google Scholar
                </a>
                <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Side dot navigator — injected by JS -->
    <nav class="page-dots" aria-label="Page navigation"></nav>

    <!-- Page prev/next arrows — injected by JS -->
    <div class="page-arrows">
        <button class="page-arrow page-arrow--prev" id="page-prev" aria-label="Previous page">
            <i class="fa-solid fa-chevron-up"></i>
        </button>
        <button class="page-arrow page-arrow--next" id="page-next" aria-label="Next page">
            <i class="fa-solid fa-chevron-down"></i>
        </button>
    </div>

    <!-- ========== PAGE ENGINE ========== -->
    <div id="page-engine">
{{SECTIONS}}
    </div>

    <!-- =========================================================
         ANALYTICS — GoatCounter (privacy-first, no cookies)
         SETUP: replace YOUR_CODE with your goatcounter.com site code
    ========================================================== -->
    <script
        data-goatcounter="https://billabobz.goatcounter.com/count"
        async src="//gc.zgo.at/count.js">
    </script>

    <!-- Quirky first-visit analytics notice -->
    <div id="gc-toast" role="status" aria-live="polite">
        <div class="gc-toast-icon">🔬</div>
        <div class="gc-toast-text">
            <strong>Psst —</strong> this site quietly counts heads.<br>
            <span class="gc-toast-sub">No cookies, no creepy tracking. Bilal just wants to know you exist 👋</span>
        </div>
        <button class="gc-toast-close" id="gc-toast-close" aria-label="Dismiss">Got it ✓</button>
    </div>

    <script src="js/main.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
